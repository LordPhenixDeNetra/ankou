name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Chemins longs (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          path: ankou
      # Dépôt frère : ankou en dépend par `path = "../lpdnsoft-libs/..."`.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/lpdnsoft-libs
          path: lpdnsoft-libs
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ankou
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo xtask ci
        working-directory: ankou

  # Vrai tunnel WireGuard entre deux namespaces réseau (root requis).
  e2e-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: ankou
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/lpdnsoft-libs
          path: lpdnsoft-libs
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ankou
      - name: Outils WireGuard
        run: |
          sudo apt-get update
          sudo apt-get install -y wireguard-tools nftables
          sudo modprobe wireguard
      - name: Compilation des tests
        working-directory: ankou
        run: |
          cargo build -p ankou-cli -p ankoud
          cargo test -p ankoud --test e2e_linux --no-run
      - name: Tests de bout en bout
        working-directory: ankou
        run: sudo -E env "PATH=$PATH" cargo test -p ankoud --test e2e_linux -- --ignored --test-threads=1
      - name: Rendre target/ au runner (cache)
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" ankou/target

  # API et base : tests contre un vrai PostgreSQL, données sqlx hors ligne à jour.
  server-db:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ankou
          POSTGRES_PASSWORD: ankou
          POSTGRES_DB: ankou
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://ankou:ankou@localhost:5432/ankou
    steps:
      - uses: actions/checkout@v4
        with:
          path: ankou
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/lpdnsoft-libs
          path: lpdnsoft-libs
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ankou
      - uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli@0.8.6
      - name: Migrations et vérification de .sqlx/
        working-directory: ankou
        env:
          SQLX_OFFLINE: "false"
        run: |
          cargo sqlx migrate run --source crates/server-store/migrations
          cargo sqlx prepare --workspace --check
      - name: Tests avec PostgreSQL
        working-directory: ankou
        run: cargo test -p ankou-server-store -p ankou-api -p ankou-admin -p ankou-node-core -p ankou-api-client -- --ignored

  # Windows réel (administrateur) : pilote wireguard-nt, pare-feu WFP, service par le pipe.
  e2e-windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Chemins longs
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          path: ankou
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/lpdnsoft-libs
          path: lpdnsoft-libs
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ankou
      - name: wireguard.dll (WireGuard LLC, signature vérifiée)
        working-directory: ankou
        run: |
          Invoke-WebRequest https://download.wireguard.com/wireguard-nt/wireguard-nt-0.10.1.zip -OutFile wgnt.zip
          Expand-Archive wgnt.zip -DestinationPath wgnt
          $dll = "wgnt\wireguard-nt\bin\amd64\wireguard.dll"
          $sig = Get-AuthenticodeSignature $dll
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'WireGuard LLC') {
            throw "signature de wireguard.dll invalide : $($sig.Status) $($sig.SignerCertificate.Subject)"
          }
          foreach ($dir in "target\debug", "crates\platform") {
            New-Item -ItemType Directory -Force "$dir\resources-windows\binaries" | Out-Null
            Copy-Item $dll "$dir\resources-windows\binaries\wireguard-amd64.dll"
          }
      - name: Compilation
        working-directory: ankou
        run: |
          cargo build -p ankoud -p ankou-cli
          cargo test -p ankou-platform --test e2e_windows --no-run
      - name: Pare-feu WFP réel
        working-directory: ankou
        run: cargo test -p ankou-platform --test e2e_windows -- --ignored --test-threads=1
      - name: Service, pipe et carte ankou0
        working-directory: ankou
        run: |
          $env:ANKOU_SOCKET = '\\.\pipe\ankou-ci'
          $state = Join-Path $env:RUNNER_TEMP 'ankou'
          $daemon = Start-Process target\debug\ankoud.exe -ArgumentList '--socket', $env:ANKOU_SOCKET, '--state-dir', $state -PassThru -NoNewWindow
          Start-Sleep -Seconds 3
          $out = target\debug\ankou-cli.exe status --lang en
          if ($out -notmatch 'Disconnected') { throw "status : $out" }
          # Sans kill switch : la machine de CI garde son réseau pendant le test.
          target\debug\ankou-cli.exe killswitch off --lang en
          @"
          [interface]
          private_key = "yAnz5TF+lXXJte14tji3zlMNq+hd2rYUIgJBgB3fBmk="
          address = ["10.8.0.2/32"]
          [peer]
          public_key = "xTIBA5rboUvnH4htodjb6e697QjLERt1NAB4mZqp8Dg="
          endpoint = "192.0.2.1:51820"
          allowed_ips = ["10.8.0.0/16"]
          "@ | Set-Content ci.toml
          target\debug\ankou-cli.exe connect --config ci.toml --wait 0 --lang en
          Start-Sleep -Seconds 2
          if (-not (Get-NetAdapter -Name ankou0 -ErrorAction SilentlyContinue)) { throw "carte ankou0 absente" }
          target\debug\ankou-cli.exe disconnect --lang en
          Start-Sleep -Seconds 2
          if (Get-NetAdapter -Name ankou0 -ErrorAction SilentlyContinue) { throw "carte ankou0 restée" }
          Invoke-WebRequest https://www.github.com -UseBasicParsing | Out-Null
          Stop-Process -Id $daemon.Id
