name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Chemins longs (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          path: ankou
      # Dépôt frère : ankou en dépend par `path = "../lpdnsoft-libs/..."`.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/lpdnsoft-libs
          path: lpdnsoft-libs
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ankou
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo xtask ci
        working-directory: ankou
