[workspace]
members = ["crates/*", "apps/*", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LordPhenixDeNetra/ankou"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"

[workspace.dependencies]
ankou-core = { path = "crates/core", version = "0.1.0" }
ankou-platform = { path = "crates/platform", version = "0.1.0" }
ankou-proto = { path = "crates/proto", version = "0.1.0" }
# Dépôt frère, cloné à côté de celui-ci (voir ADR 0001).
lpdnsoft-i18n = { path = "../lpdnsoft-libs/crates/i18n", version = "0.1.0" }
lpdnsoft-log = { path = "../lpdnsoft-libs/crates/log", version = "0.1.0" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
assert_cmd = "2"
base64 = "0.23"
ctrlc = "3"
defguard_wireguard_rs = "0.12"
ipnet = { version = "2", features = ["serde"] }
proptest = "1"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
thiserror = "2"
toml = "1"
x25519-dalek = { version = "3", features = ["static_secrets", "getrandom"] }
