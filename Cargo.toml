[workspace]
members = ["crates/*", "apps/*", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LordPhenixDeNetra/ankou"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"

[workspace.dependencies]
ankou-core = { path = "crates/core", version = "0.1.0" }
ankou-platform = { path = "crates/platform", version = "0.1.0" }
ankou-proto = { path = "crates/proto", version = "0.1.0" }
ankou-server-domain = { path = "crates/server-domain", version = "0.1.0" }
ankou-server-store = { path = "crates/server-store", version = "0.1.0" }
ankou-api = { path = "apps/ankou-api", version = "0.1.0" }
ankou-api-client = { path = "crates/api-client", version = "0.1.0" }
ankou-node-core = { path = "crates/node", version = "0.1.0" }
ankou-node = { path = "apps/ankou-node", version = "0.1.0" }
ankou-admin = { path = "apps/ankou-admin", version = "0.1.0" }
# Dépôt frère, cloné à côté de celui-ci (voir ADR 0001).
lpdnsoft-atomic = { path = "../lpdnsoft-libs/crates/atomic", version = "0.1.0" }
lpdnsoft-settings = { path = "../lpdnsoft-libs/crates/settings", version = "0.1.0" }
lpdnsoft-i18n = { path = "../lpdnsoft-libs/crates/i18n", version = "0.1.0" }
lpdnsoft-log = { path = "../lpdnsoft-libs/crates/log", version = "0.1.0" }
anyhow = "1"
argon2 = "0.6"
axum = { version = "0.8", features = ["macros", "ws"] }
futures-util = "0.3"
getrandom = "0.4"
pasetors = "0.8"
tower = { version = "0.5", features = ["util"] }
tower_governor = "0.8"
utoipa = { version = "6", features = ["uuid", "time"] }
clap = { version = "4", features = ["derive", "env"] }
assert_cmd = "2"
base64 = "0.23"
ctrlc = { version = "3", features = ["termination"] }
defguard_wireguard_rs = "0.12"
ipnet = { version = "2", features = ["serde"] }
proptest = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
thiserror = "2"
toml = "1"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
# Fournisseur cryptographique de rustls pour les WebSocket des nodes (ring, déjà présent par defguard).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "macros", "migrate", "uuid", "time", "ipnet"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
sha2 = "0.10"
time = { version = "0.3", features = ["serde-well-known", "macros"] }
uuid = { version = "1", features = ["v7", "serde"] }
x25519-dalek = { version = "3", features = ["static_secrets", "getrandom"] }

# Argon2 est très lent sans optimisation : tests et développement restent rapides.
[profile.dev.package.argon2]
opt-level = 3
